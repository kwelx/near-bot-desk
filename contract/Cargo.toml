[package]
name = "bot-desk"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Testnet desk where an agent pays 1 NEAR for one bot skill."

[lib]
name = "bot_desk"
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
